<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entropy — Challenge</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Doto:wght@100..900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../images/flag-zoom.png">
    <meta name="theme-color" content="#0a0a0a">
    <style>
        /* ── Split layout ──────────────────────────────────────────── */
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            flex-shrink: 0;
        }

        #challenge-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* ── Left panel: level list ────────────────────────────────── */
        #level-panel {
            width: 260px;
            min-width: 180px;
            border-right: 1px solid #222;
            overflow-y: auto;
            padding: 12px 0;
            background: #0a0a0a;
            flex-shrink: 0;
        }

        #level-panel h4 {
            font-family: monospace;
            color: #888;
            font-size: 0.7rem;
            margin: 0 0 8px 16px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .level-item {
            padding: 10px 16px;
            cursor: pointer;
            border-left: 3px solid transparent;
            font-family: monospace;
            font-size: 0.85rem;
            color: #aaa;
            transition: background 0.15s, color 0.15s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .level-item:hover {
            background: #141414;
            color: #eee;
        }

        .level-item.active {
            border-left-color: #00ff88;
            background: #0f1f18;
            color: #00ff88;
        }

        .level-item .lvl-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #333;
            flex-shrink: 0;
        }

        .level-item.solved .lvl-dot {
            background: #00ff88;
        }

        .level-item.active .lvl-dot {
            background: #00ff88;
        }

        /* ── Right panel: chat + submission ───────────────────────── */
        #chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #0d0d0d;
        }

        #level-header {
            padding: 12px 20px;
            border-bottom: 1px solid #1f1f1f;
            display: flex;
            align-items: baseline;
            gap: 12px;
        }

        #level-title {
            font-family: monospace;
            font-size: 1rem;
            color: #00ff88;
            font-weight: bold;
        }

        #level-desc {
            font-family: monospace;
            font-size: 0.75rem;
            color: #666;
            white-space: pre-wrap;
        }

        /* Chat history */
        #chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #chat-history p {
            margin: 0;
            font-family: monospace;
            font-size: 0.85rem;
            line-height: 1.5;
        }

        #chat-history p.bot {
            color: #00ff88;
        }

        #chat-history p.bot::before {
            content: "> ";
            color: #00ff88;
        }

        #chat-history p.user {
            color: #ccc;
        }

        #chat-history p.user::before {
            content: "$ ";
            color: #888;
        }

        #chat-history p.error {
            color: #ff4444;
        }

        #chat-history p.system {
            color: #555;
            font-style: italic;
        }

        /* Thinking indicator */
        #thinking {
            display: none;
            font-family: monospace;
            font-size: 0.8rem;
            color: #555;
            padding: 0 20px 8px;
            animation: blink 1s step-start infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        /* Chat input */
        #chat-input-row {
            display: flex;
            padding: 12px 20px;
            border-top: 1px solid #1a1a1a;
            gap: 8px;
        }

        #chat-input-row input[type="text"] {
            flex: 1;
            background: #111;
            border: 1px solid #222;
            border-radius: 4px;
            color: #eee;
            font-family: monospace;
            font-size: 0.85rem;
            padding: 8px 12px;
            outline: none;
        }

        #chat-input-row input[type="text"]:focus {
            border-color: #00ff88;
        }

        #chat-input-row button {
            background: #00ff88;
            color: #000;
            border: none;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.85rem;
            font-weight: bold;
            padding: 8px 16px;
            cursor: pointer;
            transition: opacity 0.15s;
        }

        #chat-input-row button:hover {
            opacity: 0.85;
        }

        #chat-input-row button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Flag submission */
        #flag-row {
            display: flex;
            padding: 10px 20px;
            border-top: 1px solid #1a1a1a;
            gap: 8px;
            align-items: center;
        }

        #flag-label {
            font-family: monospace;
            font-size: 0.75rem;
            color: #555;
            white-space: nowrap;
        }

        #flag-input {
            flex: 1;
            background: #111;
            border: 1px solid #222;
            border-radius: 4px;
            color: #eee;
            font-family: monospace;
            font-size: 0.85rem;
            padding: 7px 12px;
            outline: none;
        }

        #flag-input:focus {
            border-color: #00ff88;
        }

        #flag-input.correct {
            border-color: #00ff88;
        }

        #flag-input.wrong {
            border-color: #ff4444;
        }

        #flag-submit {
            background: transparent;
            border: 1px solid #444;
            border-radius: 4px;
            color: #aaa;
            font-family: monospace;
            font-size: 0.8rem;
            padding: 7px 14px;
            cursor: pointer;
            transition: border-color 0.15s, color 0.15s;
        }

        #flag-submit:hover {
            border-color: #00ff88;
            color: #00ff88;
        }

        #flag-status {
            font-family: monospace;
            font-size: 0.75rem;
            min-width: 80px;
            text-align: right;
        }

        .solved-badge {
            display: inline-block;
            background: #00ff882a;
            color: #00ff88;
            border: 1px solid #00ff8844;
            border-radius: 3px;
            font-family: monospace;
            font-size: 0.7rem;
            padding: 2px 8px;
            margin-left: 8px;
        }
    </style>
</head>

<body>
    <header>
        Entropy — Challenge
        <a class="back" href="../index.html">← transport</a>
    </header>

    <div id="challenge-layout">

        <!-- ── Left: Level list ──────────────────────────────────── -->
        <div id="level-panel">
            <h4>Levels</h4>
            <div id="level-list">
                <!-- Populated by JS from levels.yaml via /levels-config -->
            </div>
        </div>

        <!-- ── Right: Chat + submission ──────────────────────────── -->
        <div id="chat-panel">
            <div id="level-header">
                <span id="level-title">Select a level →</span>
                <span id="level-desc"></span>
            </div>

            <div id="chat-history">
                <p class="system">Select a level on the left to begin.</p>
            </div>

            <div id="thinking">⣾ thinking...</div>

            <div id="chat-input-row">
                <input type="text" id="main-chat-input" placeholder="Type your prompt..." disabled>
                <button id="main-chat-send" disabled>send</button>
            </div>

            <div id="flag-row">
                <span id="flag-label">flag:</span>
                <input type="text" id="flag-input" placeholder="ENTROPY{...}" disabled>
                <button id="flag-submit" disabled>check</button>
                <span id="flag-status"></span>
            </div>
        </div>
    </div>

    <script>
        const API = "http://localhost:8000"
        let LEVELS = []   // populated from GET /levels on load
        let activeLevelId = null
        let isSolvedMap = {}  // levelId -> bool

        // ── Auth ─────────────────────────────────────────────────────
        function getUser() {
            const uid = localStorage.getItem('ctfd_user_id')
            const uname = localStorage.getItem('username')
            if (!uid || !uname) return null
            return { ctfd_user_id: parseInt(uid), username: uname }
        }

        // ── Render level list ─────────────────────────────────────────
        function renderLevelList() {
            const list = document.getElementById('level-list')
            list.innerHTML = ''
            if (LEVELS.length === 0) {
                list.innerHTML = '<div style="padding:12px 16px;font-family:monospace;font-size:0.75rem;color:#555;">No levels configured.</div>'
                return
            }
            LEVELS.forEach(lvl => {
                const item = document.createElement('div')
                item.className = 'level-item' + (isSolvedMap[lvl.id] ? ' solved' : '')
                item.dataset.id = lvl.id
                item.innerHTML = `<span class="lvl-dot"></span><span>${lvl.name}${isSolvedMap[lvl.id] ? '<span class="solved-badge">solved</span>' : ''}</span>`
                item.addEventListener('click', () => selectLevel(lvl))
                list.appendChild(item)
            })
        }

        // ── Select a level ────────────────────────────────────────────
        async function selectLevel(lvl) {
            const user = getUser()
            if (!user) {
                alert("Please login first!\nGo to: /login/login.html")
                return
            }

            activeLevelId = lvl.id

            // Update left panel active state
            document.querySelectorAll('.level-item').forEach(el => el.classList.remove('active'))
            const activeEl = document.querySelector(`.level-item[data-id="${lvl.id}"]`)
            if (activeEl) activeEl.classList.add('active')

            // Update header
            document.getElementById('level-title').textContent = lvl.name
            document.getElementById('level-desc').textContent = lvl.description || ''

            // Clear chat
            const history = document.getElementById('chat-history')
            history.innerHTML = '<p class="system">Opening level...</p>'

            // Enable inputs
            document.getElementById('main-chat-input').disabled = false
            document.getElementById('main-chat-send').disabled = false
            document.getElementById('flag-input').disabled = false
            document.getElementById('flag-submit').disabled = false
            document.getElementById('flag-status').textContent = ''
            document.getElementById('flag-input').className = ''

            // Open level (idempotent — gets existing secret if already opened)
            try {
                const res = await fetch(`${API}/levels/${lvl.id}/open`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ctfd_user_id: user.ctfd_user_id, username: user.username }),
                })
                if (res.ok) {
                    const data = await res.json()
                    history.innerHTML = `<p class="system">Level opened. Attempts: ${data.attempts ?? 0}</p>`
                    if (data.solved) {
                        isSolvedMap[lvl.id] = true
                        renderLevelList()
                        document.getElementById('flag-status').textContent = '✅ already solved'
                        document.getElementById('flag-status').style.color = '#00ff88'
                    }
                    addMessage('bot', 'Hello! I am the Guardian. What would you like to ask?')
                } else {
                    history.innerHTML = `<p class="error">Failed to open level (${res.status})</p>`
                }
            } catch (e) {
                history.innerHTML = `<p class="error">Cannot reach backend: ${e.message}</p>`
            }
        }

        // ── Chat ──────────────────────────────────────────────────────
        function addMessage(type, text) {
            const history = document.getElementById('chat-history')
            const p = document.createElement('p')
            p.className = type
            p.textContent = text
            history.appendChild(p)
            history.scrollTop = history.scrollHeight
        }

        async function sendChat() {
            const user = getUser()
            const input = document.getElementById('main-chat-input')
            const text = input.value.trim()
            if (!text || !activeLevelId || !user) return

            addMessage('user', text)
            input.value = ''
            document.getElementById('thinking').style.display = 'block'
            document.getElementById('main-chat-send').disabled = true

            try {
                const res = await fetch(`${API}/levels/${activeLevelId}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ctfd_user_id: user.ctfd_user_id, message: text }),
                })
                const data = await res.json()
                document.getElementById('thinking').style.display = 'none'
                if (res.ok) {
                    addMessage('bot', data.response)
                } else if (res.status === 429) {
                    addMessage('error', `Rate limited — wait ${data.detail?.match(/\d+/)?.[0] ?? 5}s`)
                } else {
                    addMessage('error', data.detail || 'Error from server')
                }
            } catch (e) {
                document.getElementById('thinking').style.display = 'none'
                addMessage('error', `Network error: ${e.message}`)
            }

            document.getElementById('main-chat-send').disabled = false
        }

        document.getElementById('main-chat-send').addEventListener('click', sendChat)
        document.getElementById('main-chat-input').addEventListener('keydown', e => {
            if (e.key === 'Enter') sendChat()
        })

        // ── Flag submission ───────────────────────────────────────────
        document.getElementById('flag-submit').addEventListener('click', async () => {
            const user = getUser()
            const flagInput = document.getElementById('flag-input')
            const statusEl = document.getElementById('flag-status')
            const flag = flagInput.value.trim()
            if (!flag || !activeLevelId || !user) return

            document.getElementById('flag-submit').disabled = true
            statusEl.textContent = 'checking...'
            statusEl.style.color = '#888'

            try {
                const res = await fetch(`${API}/levels/${activeLevelId}/submit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ctfd_user_id: user.ctfd_user_id, submitted_flag: flag }),
                })
                const data = await res.json()
                document.getElementById('flag-submit').disabled = false

                if (data.correct) {
                    flagInput.className = 'correct'
                    statusEl.textContent = '✅ correct!'
                    statusEl.style.color = '#00ff88'
                    isSolvedMap[activeLevelId] = true
                    renderLevelList()
                    // Re-mark active
                    const activeEl = document.querySelector(`.level-item[data-id="${activeLevelId}"]`)
                    if (activeEl) activeEl.classList.add('active')
                } else {
                    flagInput.className = 'wrong'
                    statusEl.textContent = '❌ wrong'
                    statusEl.style.color = '#ff4444'
                    setTimeout(() => { flagInput.className = ''; statusEl.textContent = '' }, 2500)
                }
            } catch (e) {
                document.getElementById('flag-submit').disabled = false
                statusEl.textContent = 'error'
                statusEl.style.color = '#ff4444'
            }
        })

        // ── Init ──────────────────────────────────────────────────────
        async function init() {
            if (!getUser()) {
                const list = document.getElementById('level-list')
                list.innerHTML = `<div style="padding:12px 16px;font-family:monospace;font-size:0.75rem;color:#ff4444;">
                    Not logged in.<br><a href="/login/login.html" style="color:#aaa;">→ Login first</a>
                </div>`
                return
            }

            try {
                const res = await fetch(`${API}/levels/list`)
                LEVELS = await res.json()
            } catch (e) {
                console.error('Could not load levels:', e)
            }
            renderLevelList()
        }

        init()
    </script>
</body>

</html>
