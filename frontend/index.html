<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Entropy</title>
<!-- STEP 3: Markdown rendering with XSS protection -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sidebar-bg: #171717;
    --sidebar-hover: #2a2a2a;
    --main-bg: #212121;
    --input-bg: #2f2f2f;
    --border: #3f3f3f;
    --text: #ececec;
    --text-muted: #8e8ea0;
    --text-xs: #6b6b80;
    --accent: #10a37f;
    --accent-hover: #0d8f70;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --radius: 12px;
  }

  body {
    font-family: var(--font);
    background: var(--main-bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    overflow: hidden;
    font-size: 15px;
  }

  /* ===== SIDEBAR ===== */
  .sidebar {
    width: 260px;
    min-width: 260px;
    background: var(--sidebar-bg);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  .sidebar-top { padding: 12px 12px 8px; display: flex; flex-direction: column; gap: 4px; }

  .sidebar-logo {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    padding: 8px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo-badge {
    background: var(--accent);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 4px;
    letter-spacing: 0.05em;
  }

  .new-chat-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    border-radius: 8px;
    border: none;
    background: none;
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
    width: 100%;
    text-align: left;
    transition: background 0.15s;
    font-family: var(--font);
  }
  .new-chat-btn:hover { background: var(--sidebar-hover); }

  .sidebar-section-label {
    font-size: 11px;
    color: var(--text-muted);
    padding: 14px 12px 6px;
    font-weight: 500;
    letter-spacing: 0.03em;
  }

  .levels-list { flex: 1; overflow-y: auto; padding: 0 8px; }

  .level-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.12s;
    font-size: 14px;
    color: var(--text);
  }
  .level-item:hover { background: var(--sidebar-hover); }
  .level-item.active { background: var(--sidebar-hover); }
  .level-item-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .solved-tick { display: flex; align-items: center; justify-content: center; color: var(--accent); flex-shrink: 0; opacity: 0.9; }

  .sidebar-bottom { border-top: 1px solid var(--border); padding: 12px; }
  .user-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; }
  .user-avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    flex-shrink: 0;
  }
  .user-name { font-size: 14px; color: var(--text); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .health-dot { width: 8px; height: 8px; border-radius: 50%; background: #555; flex-shrink: 0; }
  .health-dot.online { background: var(--accent); box-shadow: 0 0 0 2px rgba(16,163,127,0.2); }
  .logout-btn {
    background: none; border: none; color: var(--text-muted); cursor: pointer;
    padding: 6px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
    transition: all 0.15s; margin-left: 2px;
  }
  .logout-btn:hover { background: var(--sidebar-hover); color: var(--text); }

  /* ===== MAIN ===== */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .topbar-level { font-size: 15px; font-weight: 500; color: var(--text); }
  .topbar-right { display: flex; align-items: center; gap: 16px; font-size: 12px; color: var(--text-muted); flex-wrap: wrap; }
  .topbar-right span b { color: var(--text); font-weight: 500; }

  /* STEP 1: Memory counter */
  #memory-counter { display: none; }
  #memory-counter.show { display: inline; }
  #memory-counter.warn b { color: #f0c040; }

  /* STEP 2: Token counter */
  #token-counter { display: none; }
  #token-counter.show { display: inline; }
  #token-counter.warn b { color: #f0c040; }
  #token-counter.over b { color: #f77; }

  .lb-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 12px;
    padding: 5px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-family: var(--font);
    transition: all 0.15s;
  }
  .lb-btn:hover { border-color: #666; color: var(--text); }

  .solved-banner {
    background: rgba(16,163,127,0.08);
    border-bottom: 1px solid rgba(16,163,127,0.25);
    color: var(--accent);
    font-size: 13px;
    padding: 9px 20px;
    text-align: center;
    display: none;
  }
  .solved-banner.show { display: block; }

  /* ===== WELCOME ===== */
  .welcome {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    gap: 20px;
    text-align: center;
  }
  .welcome h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; }
  .welcome p { font-size: 15px; color: var(--text-muted); max-width: 400px; line-height: 1.7; }

  .username-row { display: flex; gap: 8px; width: 100%; max-width: 360px; margin-top: 4px; }

  input[type="text"] {
    flex: 1;
    background: var(--input-bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    padding: 10px 14px;
    border-radius: 10px;
    outline: none;
    transition: border-color 0.15s;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  input[type="text"]::placeholder { color: var(--text-muted); }

  .btn-primary {
    background: var(--accent);
    border: none;
    color: #fff;
    font-family: var(--font);
    font-size: 14px;
    font-weight: 500;
    padding: 10px 18px;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .btn-primary:hover { background: var(--accent-hover); }

  .hint-cards { display: flex; flex-direction: column; gap: 10px; max-width: 400px; width: 100%; }
  .hint-card {
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    text-align: left;
  }
  .hint-card-title { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .hint-card-desc { font-size: 12px; color: var(--text-muted); line-height: 1.5; }

  /* ===== MESSAGES ===== */
  .messages-wrap { flex: 1; overflow-y: auto; }
  .messages-inner {
    max-width: 720px;
    margin: 0 auto;
    padding: 28px 24px 12px;
    display: flex;
    flex-direction: column;
  }

  .msg-row {
    display: flex;
    gap: 14px;
    padding: 12px 0;
    animation: fadeUp 0.2s ease-out;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    margin-top: 2px;
  }
  .av-user { background: var(--accent); color: #fff; }
  .av-ai { background: #444; color: var(--text); font-size: 16px; }
  .av-sys { background: none; opacity: 0; }

  .msg-body { flex: 1; min-width: 0; }
  .msg-sender { font-size: 13px; font-weight: 600; margin-bottom: 6px; }

  /* User messages: plain text */
  .msg-text { font-size: 15px; line-height: 1.75; white-space: pre-wrap; word-break: break-word; }
  .msg-text.dim { color: var(--text-muted); font-size: 13px; font-style: italic; }

  /* STEP 3: AI message markdown rendering */
  .msg-md { font-size: 15px; line-height: 1.75; word-break: break-word; }
  .msg-md p { margin-bottom: 0.75em; }
  .msg-md p:last-child { margin-bottom: 0; }
  .msg-md ul, .msg-md ol { margin: 0.5em 0 0.75em 1.4em; }
  .msg-md li { margin-bottom: 0.3em; }
  .msg-md h1, .msg-md h2, .msg-md h3 { font-weight: 600; margin: 0.8em 0 0.4em; }
  .msg-md h1 { font-size: 1.25em; }
  .msg-md h2 { font-size: 1.1em; }
  .msg-md h3 { font-size: 1em; }
  .msg-md strong { font-weight: 600; color: #f0f0f0; }
  .msg-md em { font-style: italic; color: #d0d0d0; }
  .msg-md code {
    background: #1a1a1a;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 6px;
    font-family: 'Courier New', monospace;
    font-size: 13px;
    color: #7ec8e3;
  }
  .msg-md pre {
    background: #1a1a1a;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    overflow-x: auto;
    margin: 0.75em 0;
  }
  .msg-md pre code {
    background: none;
    border: none;
    padding: 0;
    font-size: 13px;
    color: #ececec;
  }
  .msg-md blockquote {
    border-left: 3px solid var(--accent);
    padding-left: 14px;
    margin: 0.5em 0;
    color: var(--text-muted);
    font-style: italic;
  }
  .msg-md table { border-collapse: collapse; width: 100%; margin: 0.75em 0; }
  .msg-md th, .msg-md td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; font-size: 14px; }
  .msg-md th { background: #1e1e1e; font-weight: 600; }
  .msg-md a { color: var(--accent); text-decoration: underline; }
  .msg-md hr { border: none; border-top: 1px solid var(--border); margin: 1em 0; }

  .typing-row { display: none; }
  .typing-row.on { display: flex; }
  .tdots { display: flex; gap: 4px; align-items: center; padding: 6px 0; }
  .tdot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); animation: tb 1.3s infinite; }
  .tdot:nth-child(2) { animation-delay: 0.2s; }
  .tdot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes tb { 0%,60%,100%{transform:translateY(0);opacity:.4} 30%{transform:translateY(-5px);opacity:1} }

  /* ===== INPUT ===== */
  .input-area { padding: 12px 24px 20px; flex-shrink: 0; }

  .input-box {
    max-width: 720px;
    margin: 0 auto;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    transition: border-color 0.15s;
  }
  .input-box:focus-within { border-color: #555; }

  .flag-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
  }
  .flag-label { font-size: 11px; font-weight: 600; color: var(--text-muted); letter-spacing: 0.05em; white-space: nowrap; }
  .flag-field {
    flex: 1;
    background: none;
    border: none;
    color: #f0c040;
    font-family: 'Courier New', monospace;
    font-size: 13px;
    outline: none;
    padding: 0;
  }
  .flag-field::placeholder { color: #5a4a20; }
  .flag-submit {
    background: none;
    border: 1px solid #5a4a20;
    color: #f0c040;
    font-family: var(--font);
    font-size: 12px;
    font-weight: 500;
    padding: 4px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .flag-submit:hover { background: rgba(240,192,64,0.1); border-color: #f0c040; }

  .prompt-row { display: flex; align-items: flex-end; gap: 8px; padding: 8px 10px 10px 14px; }
  .prompt-ta {
    flex: 1;
    background: none;
    border: none;
    color: var(--text);
    font-family: var(--font);
    font-size: 15px;
    outline: none;
    resize: none;
    min-height: 24px;
    max-height: 200px;
    line-height: 1.6;
    padding: 4px 0;
  }
  .prompt-ta::placeholder { color: var(--text-muted); }

  .send-btn {
    width: 34px; height: 34px;
    border-radius: 8px;
    background: var(--accent);
    border: none;
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s, opacity 0.15s;
  }
  .send-btn:hover { background: var(--accent-hover); }
  .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .input-hint { max-width: 720px; margin: 8px auto 0; font-size: 11px; color: var(--text-xs); text-align: center; }

  /* ===== LEADERBOARD MODAL ===== */
  .overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 1000; align-items: center; justify-content: center;
    backdrop-filter: blur(3px);
  }
  .overlay.open { display: flex; }

  .modal {
    background: #1e1e1e;
    border: 1px solid var(--border);
    border-radius: 14px;
    width: 520px; max-width: 95vw; max-height: 80vh;
    display: flex; flex-direction: column; overflow: hidden;
    animation: mIn 0.2s ease-out;
  }
  @keyframes mIn { from{opacity:0;transform:scale(.96) translateY(8px)} to{opacity:1;transform:none} }

  .modal-hdr {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 20px; border-bottom: 1px solid var(--border);
  }
  .modal-title { font-size: 16px; font-weight: 600; }
  .modal-close {
    background: none; border: none; color: var(--text-muted);
    font-size: 20px; cursor: pointer; padding: 2px 6px;
    border-radius: 4px; font-family: var(--font); line-height: 1;
  }
  .modal-close:hover { background: var(--sidebar-hover); color: var(--text); }
  .modal-body { overflow-y: auto; padding: 16px 20px; }

  .lb-table { width: 100%; border-collapse: collapse; }
  .lb-table th {
    font-size: 11px; color: var(--text-muted); font-weight: 500;
    letter-spacing: 0.04em; text-transform: uppercase;
    padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border);
  }
  .lb-table td { padding: 11px 12px; font-size: 14px; border-bottom: 1px solid rgba(63,63,63,0.5); }
  .lb-table tr:last-child td { border-bottom: none; }
  .lb-table tr:hover td { background: rgba(255,255,255,0.02); }
  .lb-rank { color: var(--text-muted); }
  .lb-rank.gold { color: #f0c040; } .lb-rank.silver { color: #b0b0b0; } .lb-rank.bronze { color: #cd7f32; }
  .lb-solved { color: var(--accent); font-weight: 500; }
  .lb-time { color: var(--text-muted); font-size: 12px; }

  /* ===== TOAST ===== */
  #toast {
    position: fixed; bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: #2a2a2a; color: var(--text);
    font-size: 13px; padding: 10px 18px;
    border-radius: 8px; opacity: 0; pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
    z-index: 9999; white-space: nowrap;
    border: 1px solid var(--border);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.success { border-color: var(--accent); color: var(--accent); }
  #toast.error { border-color: #e34; color: #f77; }
  #toast.warn { border-color: #f0c040; color: #f0c040; }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-thumb { background: #3f3f3f; border-radius: 2px; }
</style>
</head>
<body>

<!-- ===== SIDEBAR ===== -->
<aside class="sidebar">
  <div class="sidebar-top">
    <div class="sidebar-logo">
      Entropy 
    </div>
    <button class="new-chat-btn">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
      </svg>
      New chat
    </button>
  </div>

  <div class="sidebar-section-label">Challenges</div>
  <div class="levels-list" id="levels-list">
    <div style="padding:12px;font-size:13px;color:var(--text-muted);">Enter your name to load levels</div>
  </div>

  <div class="sidebar-bottom">
    <div class="user-row">
      <div class="user-avatar" id="user-av">?</div>
      <div class="user-name" id="user-name-disp">Not set</div>
      <div class="health-dot" id="health-dot" title="API Status"></div>
      <button class="logout-btn" onclick="logout()" title="Log out">
        <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
        </svg>
      </button>
    </div>
  </div>
</aside>

<!-- ===== MAIN ===== -->
<div class="main">

  <!-- Topbar (hidden until level selected) -->
  <div class="topbar" id="topbar" style="display:none;">
    <div class="topbar-level" id="topbar-level">—</div>
    <div class="topbar-right">
      <!-- STEP 2: Per-level live token counter (hard levels) -->
      <span id="token-counter" title="Tokens used in current prompt">
        Tokens: <b id="meta-token-live">0</b> / <b id="meta-token-limit">—</b>
      </span>
      <!-- STEP 1: Memory usage counter (hard levels only) -->
      <span id="memory-counter" title="Conversation exchanges remembered">
        Memory: <b id="meta-memory-used">0</b> / <b id="meta-memory-limit">—</b> exchanges
      </span>
      <!-- Total tokens sent this session -->
      <span>Total tokens: <b id="meta-tokens">0</b></span>
      <a href="/scoreboard" target="_blank"> <button class="lb-btn">🏆 Leaderboard</button> </a>
    </div>
  </div> 

  <div class="solved-banner" id="solved-banner">✓ Level solved! Well done.</div>

  <!-- Welcome screen -->
  <div id="screen-welcome" style="flex:1;display:flex;flex-direction:column;overflow:hidden;">
    <div class="welcome">
      <div class="username-row">
        <div style="color: var(--text-muted) !important;">Reload the page to start</div>
      </div>
    </div>
  </div>

  <!-- Chat screen -->
  <div id="screen-chat" style="display:none;flex:1;flex-direction:column;overflow:hidden;">
    <div class="messages-wrap" id="messages-wrap">
      <div class="messages-inner" id="messages-inner">
        <!-- messages injected here -->
        <div class="msg-row typing-row" id="typing-row">
          <div class="msg-avatar av-ai">🤖</div>
          <div class="msg-body">
            <div class="msg-sender">AI</div>
            <div class="tdots">
              <div class="tdot"></div><div class="tdot"></div><div class="tdot"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-box">
        <div class="flag-row">
          <span class="flag-label">TOKENS</span>
          <input type="text" class="flag-field" id="flag-field" placeholder="Paste the token here when you find it " />
          <button class="flag-submit" onclick="submitFlag()">Submit</button>
        </div>
        <div class="prompt-row">
          <textarea class="prompt-ta" id="prompt-ta" placeholder="Message the AI..."
            rows="1" onkeydown="handleKey(event)" oninput="autoResize(this); updateTokenCounter();"></textarea>
          <button class="send-btn" id="send-btn" onclick="sendChat()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="input-hint">Enter to send · Shift+Enter for new line · Submit the FLAG above when you crack the level</div>
    </div>
  </div>

</div>



<div id="toast"></div>

<script>
// ============================================================
// STEP 4: Unified localStorage state under one key
// ============================================================
const LS_KEY = 'entropy_state';

function getState() {
  try {
    return JSON.parse(localStorage.getItem(LS_KEY) || '{}');
  } catch { return {}; }
}

function saveState(updates) {
  const current = getState();
  const merged = { ...current, ...updates };
  localStorage.setItem(LS_KEY, JSON.stringify(merged));
}

function getChat(levelId) {
  const s = getState();
  return (s.chatHistory || {})[levelId] || [];
}

function saveChat(levelId, messages) {
  const s = getState();
  const chatHistory = s.chatHistory || {};
  chatHistory[String(levelId)] = messages;
  saveState({ chatHistory });
}

// ===== APP STATE =====
// Backend is source of truth for: solved, token counts, memory, hints.
// localStorage is only used for: chatHistory (display), username, activeLevel (UI restore).
const S = {
  username: '',
  levels: [],        // level metadata including difficulty/memory_limit/token_limit from API
  currentLevel: null,
  session: null,
  totalTokens: 0,    // cumulative, display only — not trusted by backend
  chatBuf: [],       // in-memory buffer of current level's chat for display, synced from/to LS
  memoryUsed: 0,     // last known memory_used from backend response
};

// ===== marked.js config =====
marked.setOptions({ breaks: true, gfm: true });

// ===== API =====
async function api(method, path, body) {
  const res = await fetch('/api' + path, {
    method,
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
    ...(body ? { body: JSON.stringify(body) } : {}),
  });
  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    const err = new Error(e.detail || `HTTP ${res.status}`);
    err.status = res.status;
    throw err;
  }
  return res.json();
}

// ===== HEALTH =====
async function checkHealth() {
  try { await api('GET', '/health'); dot(true); } catch { dot(false); }
}
function dot(ok) {
  document.getElementById('health-dot').className = 'health-dot' + (ok ? ' online' : '');
}

// ===== USERNAME =====
function setUsername(nameOverride) {
  const inputEl = document.getElementById('username-input');
  const v = nameOverride || (inputEl ? inputEl.value.trim() : '');
  if (!v) { toast('Please enter a name', 'warn'); return; }
  S.username = v;
  saveState({ username: v });
  document.getElementById('user-name-disp').textContent = v;
  document.getElementById('user-av').textContent = v[0].toUpperCase();
  document.getElementById('topbar').style.display = 'flex';
  loadLevels();
}
const userInputEl = document.getElementById('username-input');
if (userInputEl) {
  userInputEl.addEventListener('keydown', e => { if (e.key === 'Enter') setUsername(); });
}

// ===== LEVELS =====
async function loadLevels() {
  const el = document.getElementById('levels-list');
  el.innerHTML = '<div style="padding:12px;font-size:13px;color:var(--text-muted);">Loading...</div>';
  try {
    const usernameParam = S.username ? `?username=${encodeURIComponent(S.username)}` : '';
    S.levels = await api('GET', `/levels/list${usernameParam}`);
    // NOTE: solved status comes from backend only — not from localStorage
    renderLevels();

    const st = getState();
    const active = st.activeLevel;
    if (active && !S.currentLevel) {
      openLevel(parseInt(active));
    } else if (S.autoLogin && !S.currentLevel && S.levels.length) {
      openLevel(S.levels[0].id);
    }
  } catch (e) {
    el.innerHTML = `<div style="padding:12px;font-size:13px;color:#f77;">${esc(e.message)}</div>`;
  }
}

function renderLevels() {
  const el = document.getElementById('levels-list');
  if (!S.levels.length) { el.innerHTML = '<div style="padding:12px;font-size:13px;color:var(--text-muted);">No levels found</div>'; return; }
  el.innerHTML = S.levels.map(l => `
    <div class="level-item ${S.currentLevel?.id === l.id ? 'active' : ''}" id="li-${l.id}" onclick="openLevel(${l.id})">
      <span class="level-item-name">${esc(l.name)}</span>
      ${l.solved ? `<span class="solved-tick" title="Solved"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>` : ''}
    </div>`).join('');
}

// ===== OPEN LEVEL =====
async function openLevel(id) {
  if (!S.username) { toast('Set your name first', 'warn'); return; }
  const level = S.levels.find(l => l.id === id);
  if (!level) return;
  try {
    const session = await api('POST', `/levels/${id}/open`, { username: S.username });
    S.session = session;
    S.currentLevel = level;
    S.totalTokens = 0;
    S.memoryUsed = 0;

    // Switch screens
    document.getElementById('screen-welcome').style.display = 'none';
    const cs = document.getElementById('screen-chat');
    cs.style.display = 'flex'; cs.style.flexDirection = 'column';

    document.getElementById('topbar-level').textContent = level.name;

    // Solved state comes ONLY from backend
    const isSolved = session.solved;
    document.getElementById('solved-banner').className = 'solved-banner' + (isSolved ? ' show' : '');
    if (isSolved) {
      const lv = S.levels.find(l => l.id === id);
      if (lv) lv.solved = true;
    }

    // STEP 1: Show/hide memory counter
    if (session.memory_used !== undefined && session.memory_used !== null) {
      S.memoryUsed = session.memory_used;
      updateMemoryDisplay(S.memoryUsed, level.memory_limit);
    } else {
      S.memoryUsed = 0;
      updateMemoryDisplay(0, level.memory_limit);
    }

    // STEP 2: Show/hide token counter for hard levels
    updateTokenCounterDisplay(level.token_limit);

    document.getElementById('meta-tokens').textContent = '0';

    clearMessages();
    saveState({ activeLevel: id });

    // Restore chat history from localStorage for display
    S.chatBuf = getChat(id);
    if (S.chatBuf.length === 0) {
      addSysMsg(`${level.name} — ${level.description || 'Find the hidden flag.'}`, false);
      // Don't save system info messages to chat history
    } else {
      S.chatBuf.forEach(m => {
        if (m.role === 'sys') addSysMsg(m.text, false);
        else if (m.role === 'ai') addAIMsg(m.text, false);
        else addUserMsg(m.text, false);
      });
    }

    document.querySelectorAll('.level-item').forEach(el => el.classList.remove('active'));
    document.getElementById('li-' + id)?.classList.add('active');
    document.getElementById('prompt-ta').focus();

    // Reset token counter live display
    document.getElementById('prompt-ta').value = '';
    updateTokenCounter();
    renderLevels();
  } catch (e) { toast('Failed to open: ' + e.message, 'error'); }
}

// ===== STEP 1: Memory display =====
function updateMemoryDisplay(used, limit) {
  const el = document.getElementById('memory-counter');
  if (!limit) { el.className = 'memory-counter'; return; } // hide
  document.getElementById('meta-memory-used').textContent = used;
  document.getElementById('meta-memory-limit').textContent = limit;
  el.className = 'show' + (used >= limit ? ' warn' : '');
  el.id = 'memory-counter'; // reset id
  el.className = 'show' + (used >= limit ? ' warn' : '');
}

// ===== STEP 2: Token counter display =====
function updateTokenCounterDisplay(tokenLimit) {
  const el = document.getElementById('token-counter');
  if (!tokenLimit) { el.className = ''; return; } // hide, stateless level
  document.getElementById('meta-token-limit').textContent = tokenLimit;
  el.className = 'show';
}

function updateTokenCounter() {
  const level = S.currentLevel;
  if (!level || !level.token_limit) return;
  const text = document.getElementById('prompt-ta').value;
  const approxTokens = Math.max(1, Math.ceil(text.length / 4));
  document.getElementById('meta-token-live').textContent = approxTokens;
  const el = document.getElementById('token-counter');
  const limit = level.token_limit;
  if (approxTokens > limit) {
    el.className = 'show over';
  } else if (approxTokens > limit * 0.85) {
    el.className = 'show warn';
  } else {
    el.className = 'show';
  }
}

// ===== CHAT =====
async function sendChat() {
  if (!S.currentLevel || !S.username) return;
  const ta = document.getElementById('prompt-ta');
  const msg = ta.value.trim();
  if (!msg) return;

  // STEP 2: Client-side token pre-check (friendly warning before backend rejects)
  if (S.currentLevel.token_limit) {
    const approx = Math.ceil(msg.length / 4);
    if (approx > S.currentLevel.token_limit) {
      toast(`Prompt too long: ~${approx} tokens (max ${S.currentLevel.token_limit})`, 'warn');
      return;
    }
  }

  ta.value = ''; autoResize(ta); updateTokenCounter(); setSending(true);
  addUserMsg(msg); setTyping(true);
  try {
    const res = await api('POST', `/levels/${S.currentLevel.id}/chat`, { username: S.username, message: msg });
    setTyping(false); addAIMsg(res.response);
    S.totalTokens += res.input_tokens_approx || 0;
    document.getElementById('meta-tokens').textContent = S.totalTokens;

    // STEP 1: Update memory counter from backend response
    if (res.memory_limit !== null && res.memory_limit !== undefined) {
      S.memoryUsed = res.memory_used || 0;
      updateMemoryDisplay(S.memoryUsed, res.memory_limit);

      if (res.memory_reset) {
        toast('Memory exhausted. Conversation restarted.', 'warn');
        addSysMsg('⚠ Memory limit reached. The AI has forgotten the previous conversation and started over.', true);
      }
    }
  } catch (e) {
    setTyping(false);
    addSysMsg('⚠ ' + e.message);
    toast(e.message, 'error');
  }
  setSending(false); document.getElementById('prompt-ta').focus();
}

// ===== FLAG =====
async function submitFlag() {
  if (!S.currentLevel || !S.username) return;
  const fi = document.getElementById('flag-field');
  const flag = fi.value.trim();
  if (!flag) { toast('Enter a flag first', 'warn'); return; }
  try {
    const res = await api('POST', '/submit_flag', { flag, level_id: S.currentLevel.id, username: S.username });
    if (res.status === 'correct' || res.status === 'already_solved') {
      toast(res.status === 'already_solved' ? '✓ You already solved this level!' : '🎉 Correct flag! Level solved!', 'success');
      addSysMsg('✓ ' + res.message);
      document.getElementById('solved-banner').className = 'solved-banner show';
      fi.value = '';
      // Solved state reflected locally for UI only — source of truth is backend
      const lv = S.levels.find(l => l.id === S.currentLevel.id);
      if (lv) lv.solved = true;
      renderLevels();
      document.getElementById('li-' + S.currentLevel.id)?.classList.add('active');
    } else {
      toast(res.message || 'Wrong flag. Keep trying!', 'error');
      addSysMsg('✗ ' + (res.message || 'Incorrect flag. Try again.'));
    }
  } catch (e) { toast('Submit error: ' + e.message, 'error'); }
}

// ===== MESSAGES =====
function clearMessages() {
  document.querySelectorAll('#messages-inner .msg-row:not(#typing-row)').forEach(el => el.remove());
}

function logout() {
  // STEP 4: On logout, clear the unified state key
  localStorage.removeItem(LS_KEY);
  window.location.href = '/logout';
}

function saveChatMsg(text, role) {
  if (!S.currentLevel) return;
  S.chatBuf.push({ text, role });
  saveChat(S.currentLevel.id, S.chatBuf);
}

function addUserMsg(text, save=true) {
  insert(`<div class="msg-row">
    <div class="msg-avatar av-user">${S.username[0].toUpperCase()}</div>
    <div class="msg-body"><div class="msg-sender">You</div><div class="msg-text">${esc(text)}</div></div>
  </div>`);
  if (save) saveChatMsg(text, 'user');
}

// STEP 3: AI messages rendered as sanitized Markdown
function addAIMsg(text, save=true) {
  const safeHtml = DOMPurify.sanitize(marked.parse(text));
  insert(`<div class="msg-row">
    <div class="msg-avatar av-ai">🤖</div>
    <div class="msg-body"><div class="msg-sender">AI</div><div class="msg-md">${safeHtml}</div></div>
  </div>`);
  if (save) saveChatMsg(text, 'ai');
}

function addSysMsg(text, save=true) {
  insert(`<div class="msg-row">
    <div class="msg-avatar av-sys"></div>
    <div class="msg-body"><div class="msg-text dim">${esc(text)}</div></div>
  </div>`);
  if (save) saveChatMsg(text, 'sys');
}

function insert(html) {
  const inner = document.getElementById('messages-inner');
  const typing = document.getElementById('typing-row');
  const d = document.createElement('div');
  d.innerHTML = html;
  inner.insertBefore(d.firstElementChild, typing);
  const wrap = document.getElementById('messages-wrap');
  wrap.scrollTop = wrap.scrollHeight;
}
function setTyping(on) {
  document.getElementById('typing-row').className = 'msg-row typing-row' + (on ? ' on' : '');
  const wrap = document.getElementById('messages-wrap');
  wrap.scrollTop = wrap.scrollHeight;
}
function setSending(v) {
  document.getElementById('send-btn').disabled = v;
  document.getElementById('prompt-ta').disabled = v;
}

// ===== UTILS =====
function handleKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); } }
function autoResize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 200) + 'px'; }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

let toastT;
function toast(msg, type = 'info') {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'show ' + type;
  clearTimeout(toastT);
  toastT = setTimeout(() => { el.className = ''; }, 3200);
}

// ===== INIT =====
checkHealth();
setInterval(checkHealth, 30000);

// On load, check if already logged in to CTFd — skip name screen if so
(async function init() {
  document.getElementById('screen-welcome').style.display = 'none';
  try {
    const me = await api('GET', '/me');
    if (me && me.username) {
      S.autoLogin = true;
      setUsername(me.username);
      return;
    }
  } catch (e) {
    // Expected on local standalone mode (or if not logged into CTFd)
  }
  // Fallback: show welcome screen
  document.getElementById('screen-welcome').style.display = 'flex';
  // STEP 4: Restore username from unified entropy_state key
  const st = getState();
  if (st.username) setUsername(st.username);
})();
</script>
</body>
