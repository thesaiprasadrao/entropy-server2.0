# ──────────────────────────────────────────────────────────────────────────────
# Entropy — Level Configuration
#
# Each level entry has:
#   id:            integer, matches the DB primary key
#   name:          display name shown in the UI
#   description:   short challenge description shown to participants
#   system_prompt: injected into the LLM before every chat. Use {flag} as
#                  the placeholder — it will be replaced with the user's
#                  assigned flag at runtime.
#   flags:         pool of flags distributed randomly to users on /open.
#                  Pool should be >= number of expected participants to
#                  minimise flag sharing (one token per participant is ideal).
#
# How flags are assigned:
#   When a user calls POST /levels/{id}/open for the first time, the backend
#   randomly picks one flag from the pool and stores it as that user's flag.
#   Repeated /open calls return the same flag (idempotent).
#   The flag_value submitted by the user must match their assigned flag exactly.
# ──────────────────────────────────────────────────────────────────────────────

