services:

  db:
    image: postgres:15-alpine
    container_name: entropy_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: entropy_backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./levels.yaml:/app/levels.yaml:ro
      - ./app:/app/app:ro
    # No host port published — accessed only via nginx at /api/
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    container_name: entropy_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - ctfd

  ctfd:
    image: ctfd/ctfd:3.8.2
    container_name: entropy_ctfd
    restart: always
    environment:
      - SECRET_KEY=${CTFD_SECRET_KEY}
      - DATABASE_URL=sqlite:////var/ctfd/ctfd.db
      - UPLOAD_FOLDER=/var/ctfd/uploads
      - LOG_FOLDER=/var/ctfd/logs
      - WORKERS=1
      - REVERSE_PROXY=true
    volumes:
      # Named Docker volume avoids host-filesystem permission errors.
      # CTFd runs as UID 1001 internally; bind-mounts owned by root/host-user cause
      # "unable to open database file" errors. Named volumes are created with correct ownership.
      - ctfd_data:/var/ctfd
    # No host port published — accessed only via nginx at /


volumes:
  postgres_data:
  ctfd_data:
