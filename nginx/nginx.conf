server {
    listen 80;
    server_name localhost;

    # ── CTFd at root ──────────────────────────────────────────────────────────
    # CTFd runs at / so its absolute asset paths (/static/..., /login, etc.)
    # resolve correctly. Users hit localhost and see CTFd login first.
    location / {
        proxy_pass http://ctfd:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Set-Cookie;
    }

    # ── Chat UI at /chat/ ────────────────────────────────────────────────────
    # Frontend static files served under /chat/
    # Participants can open this after logging into CTFd
    location /chat/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /chat/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
    }

    # ── FastAPI backend ───────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
